<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Line Equation Drawer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #canvasContainer { border: 1px solid #000; width: 400px; height: 400px; position: relative; }
        canvas { width: 100%; height: 100%; }
        .input-group { margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Draw Line from Two Points</h1>
    <div class="input-group">
        <label>x1: <input type="number" id="x1" value="-1"></label>
        <label>y1: <input type="number" id="y1" value="-1"></label>
        <label>x2: <input type="number" id="x2" value="2"></label>
        <label>y2: <input type="number" id="y2" value="3"></label>
        <button id="drawBtn">Draw</button>
    </div>
    <p id="equation"></p>
    <div id="canvasContainer">
        <canvas id="plot" width="400" height="400"></canvas>
    </div>

<script>
(function() {
    const canvas = document.getElementById('plot');
    const ctx = canvas.getContext('2d');
    const eqDisplay = document.getElementById('equation');

    function drawAxes(scale) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#aaa';
        // x-axis
        ctx.moveTo(0, canvas.height/2);
        ctx.lineTo(canvas.width, canvas.height/2);
        // y-axis
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();
    }

    function toCanvasCoord(x, y, scale) {
        return [canvas.width/2 + x * scale, canvas.height/2 - y * scale];
    }

    function drawLine(x1, y1, x2, y2, scale) {
        const [cx1, cy1] = toCanvasCoord(x1, y1, scale);
        const [cx2, cy2] = toCanvasCoord(x2, y2, scale);
        ctx.beginPath();
        ctx.strokeStyle = 'red';
        ctx.moveTo(cx1, cy1);
        ctx.lineTo(cx2, cy2);
        ctx.stroke();
    }

    function computeAndDraw() {
        const x1 = parseFloat(document.getElementById('x1').value);
        const y1 = parseFloat(document.getElementById('y1').value);
        const x2 = parseFloat(document.getElementById('x2').value);
        const y2 = parseFloat(document.getElementById('y2').value);

        if (x1 === x2) {
            eqDisplay.textContent = 'x1 and x2 cannot be equal for y = ax + b';
            drawAxes(1);
            return;
        }

        const a = (y2 - y1) / (x2 - x1);
        const b = y1 - a * x1;
        const eqStr = `y = ${a.toFixed(2)}x + ${b.toFixed(2)}`;
        eqDisplay.textContent = eqStr;

        const maxCoord = Math.max(Math.abs(x1), Math.abs(x2), Math.abs(y1), Math.abs(y2), 10);
        const scale = (canvas.width / 2) / maxCoord;

        drawAxes(scale);
        drawLine(x1, y1, x2, y2, scale);
    }

    document.getElementById('drawBtn').addEventListener('click', computeAndDraw);
    // initial draw
    computeAndDraw();
})();
</script>
</body>
</html>
